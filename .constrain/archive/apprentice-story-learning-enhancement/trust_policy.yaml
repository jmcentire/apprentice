chronicler_integration:
  trust_level: "high"
  verification_required: true
  state_reconciliation:
    - "StoryCollector must validate Chronicler story state"
    - "Disagreements logged and escalated"
    - "Fallback to atomic mode on persistent conflicts"

story_data_integrity:
  collection_validation:
    - "Each story step must be validated before processing"
    - "Incomplete stories handled gracefully"
    - "Corrupted story data isolated and logged"
  
  evaluation_trust:
    - "JourneyEvaluator metrics validated against ground truth"
    - "Optimization patterns verified before application"
    - "Success vs struggle pattern distinction enforced"

external_dependencies:
  frontier_api:
    trust_level: "medium"
    retry_policy: "exponential backoff with circuit breaker"
    fallback: "local model routing on sustained failures"
  
  local_model:
    trust_level: "high"
    validation: "output consistency checks required"
    monitoring: "performance degradation detection"

user_privacy:
  data_retention:
    - "Story data anonymized where possible"
    - "User consent verification for extended storage"
    - "Right to deletion honored within 30 days"
  
  story_content:
    - "Sensitive information detection and redaction"
    - "Cross-story correlation prevention"
    - "User journey isolation maintained"