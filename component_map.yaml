version: "1"
project: apprentice
components:
  - id: config_loader
    role: library
    authority: configuration
    data_access:
      PUBLIC: read

  - id: task_registry
    role: library
    authority: task_definitions
    data_access:
      PUBLIC: read_write

  - id: router
    role: library
    authority: traffic_routing
    data_access:
      PUBLIC: read_write

  - id: remote_api_client
    role: library
    authority: frontier_api
    data_access:
      PUBLIC: read_write
      AUTH: read

  - id: local_model_server
    role: library
    authority: local_inference
    data_access:
      PUBLIC: read_write

  - id: evaluators
    role: library
    authority: quality_scoring
    data_access:
      PUBLIC: read

  - id: phase_manager
    role: library
    authority: phase_transitions
    data_access:
      PUBLIC: read_write

  - id: training_data_store
    role: library
    authority: training_data
    data_access:
      PUBLIC: read_write
      PII: write

  - id: pii_tokenizer
    role: library
    authority: pii_protection
    data_access:
      PII: read_write

  - id: fine_tuning_orchestrator
    role: library
    authority: model_training
    data_access:
      PUBLIC: read_write

  - id: budget_manager
    role: library
    authority: cost_tracking
    data_access:
      FINANCIAL: read_write

  - id: audit_log
    role: library
    authority: audit_trail
    data_access:
      PUBLIC: write
      COMPLIANCE: write

  - id: cli
    role: ingress
    protocol: cli
    authority: user_commands
    data_access:
      PUBLIC: read_write

edges:
  - from: cli
    to: router
    tier: internal
  - from: router
    to: remote_api_client
    tier: cross_boundary
  - from: router
    to: local_model_server
    tier: cross_boundary
  - from: router
    to: phase_manager
    tier: internal
  - from: router
    to: budget_manager
    tier: internal
  - from: training_data_store
    to: pii_tokenizer
    tier: internal
  - from: fine_tuning_orchestrator
    to: training_data_store
    tier: internal
  - from: phase_manager
    to: evaluators
    tier: internal
  - from: router
    to: audit_log
    tier: internal
